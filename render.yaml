services:
  - type: web
    name: odinkod
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node app.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: PAYMENT_MODE
        value: demo
      - key: SUBSCRIPTION_PRICE_USD
        value: 5
      - key: AUTO_JOBS
        value: false
      - key: SESSION_SECRET
        generateValue: true
