services:
  - type: web
    name: odinkod
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node app-fixed.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: SUBSCRIPTION_PRICE_USD
        value: 5
      - key: AUTO_JOBS
        value: true
      - key: PROMO_SYNC_MINUTES
        value: 60
      - key: SESSION_SECRET
        generateValue: true
